name: Imposta turni MacroDroid

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [gh-pages]
    paths:
      - "turni-settimanali.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduler-turni-gh-pages
  cancel-in-progress: false

jobs:
  aggiorna-turni:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Imposta e verifica le fasce in scadenza
        id: schedule
        continue-on-error: true
        run: python scripts/schedule_turni.py
      - name: Pubblica lo stato dell'esecuzione
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation-state.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento di stato."
            exit 0
          fi
          git commit -m "Aggiorna stato automazione turni"
          git push origin HEAD:gh-pages
      - name: Segnala l'esito non verificato
        if: steps.schedule.outcome == 'failure'
        run: exit 1
